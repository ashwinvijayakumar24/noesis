[pytest]
# Pytest configuration for Noesis backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    property: Property-based tests using Hypothesis
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests

# Coverage settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Hypothesis settings
hypothesis_profile = default

[hypothesis]
# Hypothesis configuration
# Set max_examples for property tests (default in code is 50-100)
# Set timeout for test execution
max_examples = 100
deadline = None
