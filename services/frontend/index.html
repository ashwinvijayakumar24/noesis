    <!-- Schema.org JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Noesis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Noesis is a pre-submission review workspace for academic drafts. It reviews a manuscript against project literature and targeted scholarly context, then returns reviewer-style feedback, citation checks, coverage gaps, and revision tasks."
          }
        },
        {
          "@type": "Question",
          "name": "How is Noesis different from other AI writing tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Noesis does not write or rewrite your paper. It is designed for critique: identifying weak claims, missing citations, reviewer-facing issues, and structural problems so the author can revise their own work."
          }
        },
        {
          "@type": "Question",
          "name": "Does Noesis only use papers I upload?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your project literature is the primary context, but Noesis can also use targeted external scholarly lookup to help identify missing support, related work, or reviewer-facing gaps. External services receive focused search queries or citation context, not your full draft file."
          }
        },
        {
          "@type": "Question",
          "name": "What file types does Noesis support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Noesis supports PDF, DOCX, and TXT file formats for draft uploads, and BibTeX (.bib) files for importing your reference library."
          }
        },
        {
          "@type": "Question",
          "name": "Does Noesis write my paper for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Noesis does not write, rewrite, or auto-generate any part of your paper. It critiques your existing draft by finding weaknesses, unsupported claims, and citation gaps so you can strengthen your own arguments."
          }
        }
      ]
    }
    </script>
