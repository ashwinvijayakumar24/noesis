    <!-- Schema.org JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Noesis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Noesis is an AI pre-submission peer review tool. Upload your research draft and Noesis finds unsupported claims, citation gaps, and methodology blind spots — grounded in your literature and 200M+ papers."
          }
        },
        {
          "@type": "Question",
          "name": "How is Noesis different from other AI writing tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Noesis does not write or rewrite your paper. It acts like an expert academic reviewer: identifying what a hostile reviewer would flag before you submit. Every piece of feedback is grounded in your uploaded literature."
          }
        },
        {
          "@type": "Question",
          "name": "Is Noesis free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Noesis has a free tier that includes 5 draft analyses per month and access to 200M+ papers. Pro plan is $12/month for unlimited use."
          }
        },
        {
          "@type": "Question",
          "name": "What file types does Noesis support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Noesis supports PDF, DOCX, and TXT file formats for draft uploads, and BibTeX (.bib) files for importing your reference library."
          }
        },
        {
          "@type": "Question",
          "name": "Does Noesis write my paper for me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Noesis does not write, rewrite, or auto-generate any part of your paper. It critiques your existing draft — finding weaknesses, unsupported claims, and citation gaps — so you can strengthen your own arguments."
          }
        }
      ]
    }
