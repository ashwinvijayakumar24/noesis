# TEMPLATE ONLY — every value here is a placeholder. Never commit real keys.
# infra/k8s/02-secret.yaml is gitignored; this .example file is the tracked one.
#
# Preferred way to create the real Secret (no plaintext YAML on disk at all):
#
#   kubectl create secret generic noesis-secrets \
#     --namespace noesis \
#     --from-env-file=services/backend/.env
#
# That reads the existing KEY=value file compose already uses (env_file:) and
# creates one Secret key per line. Re-run with `--dry-run=client -o yaml |
# kubectl apply -f -` to update an existing Secret in place.
#
# If you would rather keep a file, copy this to 02-secret.yaml and fill it in.
# stringData (not data) means values are written literally — no base64 by hand.
apiVersion: v1
kind: Secret
metadata:
  name: noesis-secrets
  namespace: noesis
  labels:
    app.kubernetes.io/name: noesis
    app.kubernetes.io/part-of: noesis
type: Opaque
stringData:
  # Required — the app will not do anything useful without these.
  OPENAI_API_KEY: "REPLACE_ME"
  SUPABASE_URL: "REPLACE_ME"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  SUPABASE_ANON_KEY: "REPLACE_ME"

  # Optional — every field below is Optional[str] = None in
  # services/backend/app/core/config.py, so the app boots without them.
  # Leave them as placeholders if you are not exercising billing or Sentry.
  SENTRY_DSN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_ID_PRO: ""
  STRIPE_PRICE_ID_TEAM: ""
