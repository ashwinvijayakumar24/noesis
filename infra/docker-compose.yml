services:
  # Redis for Celery task queue (Phase 3)
  redis:
    image: redis:7-alpine
    container_name: noesis-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

  grobid:
    image: lfoppiano/grobid:0.7.0
    container_name: noesis-grobid
    platform: linux/amd64  # Run with emulation on Apple Silicon
    ports:
      - "8070:8070"
    # Note: GROBID image doesn't include curl/wget, so we skip healthcheck
    # The backend handles GROBID failures gracefully
    restart: unless-stopped

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    container_name: noesis-backend
    env_file:
      - ../services/backend/.env
    environment:
      GROBID_URL: http://grobid:8070
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery-worker:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    container_name: noesis-celery-worker
    env_file:
      - ../services/backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      GROBID_URL: http://grobid:8070
    command: celery -A app.celery_app worker --loglevel=info --pool=gevent --autoscale=3,1 --queues=default,analysis,insights
    depends_on:
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../services/frontend
      dockerfile: Dockerfile
    container_name: noesis-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
