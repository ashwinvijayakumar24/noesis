services:
  db:
    image: pgvector/pgvector:pg15
    container_name: noesis-db
    environment:
      POSTGRES_USER: noesis
      POSTGRES_PASSWORD: noesis_password
      POSTGRES_DB: noesis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noesis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: noesis-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grobid:
    image: lfoppiano/grobid:0.7.0
    container_name: noesis-grobid
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    container_name: noesis-backend
    env_file:
      - ../services/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://noesis:noesis_password@db:5432/noesis_dev
      REDIS_URL: redis://redis:6379
      GROBID_URL: http://grobid:8070
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../services/frontend
      dockerfile: Dockerfile
    container_name: noesis-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
