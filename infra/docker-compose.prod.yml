version: '3.8'

services:
  # ============================================
  # Redis (Celery Task Queue - Phase 3)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: noesis-redis-prod
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

    volumes:
      - redis-data:/data

    networks:
      - noesis-network

  # ============================================
  # GROBID (PDF Processing - On Demand)
  # ============================================
  grobid:
    image: lfoppiano/grobid:0.7.0
    container_name: noesis-grobid-prod
    platform: linux/amd64  # Run with emulation on ARM-based hosts
    restart: unless-stopped

    # GROBID is memory-hungry — needs headroom for concurrent PDF processing
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'
        reservations:
          memory: 768M

    # Note: GROBID image doesn't include curl/wget, so we skip healthcheck
    # The backend and celery workers handle GROBID failures gracefully

    networks:
      - noesis-network

  # ============================================
  # Docling (layout PDF parser — per-block coordinates)
  # Used when PDF_PARSER=docling; GROBID stays as fallback + references.
  # ============================================
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: noesis-docling-prod
    platform: linux/amd64
    restart: unless-stopped

    environment:
      DOCLING_SERVE_ENABLE_UI: "false"

    # CPU layout inference needs RAM headroom for the bundled models.
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.0'
        reservations:
          memory: 2048M

    networks:
      - noesis-network

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.prod
    container_name: noesis-backend-prod
    restart: unless-stopped

    env_file:
      - ../services/backend/.env.production

    environment:
      # Docker internal networking
      GROBID_URL: http://grobid:8070
      DOCLING_URL: http://docling-serve:5001
      PDF_PARSER: ${PDF_PARSER:-docling}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      # Span sink. Without this the tracer built into the draft-analysis graph
      # is a no-op and no trace ever lands anywhere. File sits on the existing
      # backend_logs volume so it survives a container restart.
      # ROTATION: the jsonl adapter only ever appends — nothing truncates this
      # file. Rotate it from the host (logrotate on the backend_logs volume, or
      # a cron `mv`+restart) before it fills the disk. One draft analysis writes
      # roughly 20-40 spans / ~15 KB.
      NOESIS_TRACING_BACKEND: ${NOESIS_TRACING_BACKEND:-jsonl}
      NOESIS_TRACING_FILE: /app/logs/noesis_traces.jsonl

    volumes:
      # Persistent storage for uploaded PDFs
      - pdf_storage:/app/pdfs
      # Logs for debugging + the span sink above
      - backend_logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

    depends_on:
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
      docling-serve:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Expose to Nginx reverse proxy
    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - noesis-network

  # ============================================
  # Celery Worker (Background Tasks - Phase 3)
  # ============================================
  celery-worker:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.prod
    container_name: noesis-celery-worker-prod
    restart: unless-stopped

    env_file:
      - ../services/backend/.env.production

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      GROBID_URL: http://grobid:8070
      DOCLING_URL: http://docling-serve:5001
      PDF_PARSER: ${PDF_PARSER:-docling}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      # The worker is where draft analysis actually runs, so this is the sink
      # that matters. Separate volume from the backend's, so separate file —
      # two containers never append to one path. Same rotation caveat as above.
      NOESIS_TRACING_BACKEND: ${NOESIS_TRACING_BACKEND:-jsonl}
      NOESIS_TRACING_FILE: /app/logs/noesis_traces.jsonl

    command: celery -A app.celery_app worker --loglevel=info --pool=gevent --autoscale=3,1 --queues=default,analysis,insights

    volumes:
      # Logs for debugging + the span sink above
      - celery_logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M

    depends_on:
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
      docling-serve:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

    networks:
      - noesis-network

networks:
  noesis-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  pdf_storage:
    driver: local
  backend_logs:
    driver: local
  celery_logs:
    driver: local
