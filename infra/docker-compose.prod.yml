version: '3.8'

services:
  # ============================================
  # Redis (Celery Task Queue - Phase 3)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: noesis-redis-prod
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

    volumes:
      - redis-data:/data

    networks:
      - noesis-network

  # ============================================
  # GROBID (PDF Processing - On Demand)
  # ============================================
  grobid:
    image: lfoppiano/grobid:0.7.0
    container_name: noesis-grobid-prod
    platform: linux/amd64  # Run with emulation on ARM-based hosts
    restart: unless-stopped

    # GROBID is memory-hungry — needs headroom for concurrent PDF processing
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'
        reservations:
          memory: 768M

    # Note: GROBID image doesn't include curl/wget, so we skip healthcheck
    # The backend and celery workers handle GROBID failures gracefully

    networks:
      - noesis-network

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.prod
    container_name: noesis-backend-prod
    restart: unless-stopped

    env_file:
      - ../services/backend/.env.production

    environment:
      # Docker internal networking
      GROBID_URL: http://grobid:8070
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ENVIRONMENT: production
      LOG_LEVEL: INFO

    volumes:
      # Persistent storage for uploaded PDFs
      - pdf_storage:/app/pdfs
      # Logs for debugging
      - backend_logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

    depends_on:
      redis:
        condition: service_healthy
      grobid:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Expose to Nginx reverse proxy
    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - noesis-network

  # ============================================
  # Celery Worker (Background Tasks - Phase 3)
  # ============================================
  celery-worker:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.prod
    container_name: noesis-celery-worker-prod
    restart: unless-stopped

    env_file:
      - ../services/backend/.env.production

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      GROBID_URL: http://grobid:8070
      ENVIRONMENT: production
      LOG_LEVEL: INFO

    command: celery -A app.celery_app worker --loglevel=info --pool=gevent --autoscale=6,2 --queues=default,analysis,insights

    volumes:
      # Logs for debugging
      - celery_logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M

    depends_on:
      redis:
        condition: service_healthy
      grobid:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

    networks:
      - noesis-network

networks:
  noesis-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  pdf_storage:
    driver: local
  backend_logs:
    driver: local
  celery_logs:
    driver: local
