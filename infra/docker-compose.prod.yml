version: '3.8'

services:
  # ============================================
  # PostgreSQL with pgvector (Primary Data Store)
  # ============================================
  db:
    image: pgvector/pgvector:pg15
    container_name: noesis-db-prod
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: noesis_prod
      # Performance tuning for 1GB RAM instance
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 256MB
      POSTGRES_WORK_MEM: 4MB

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro

    # CRITICAL: Memory limits for micro instance
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # No port exposure - only accessible within Docker network
    networks:
      - noesis-network

  # ============================================
  # Redis (Caching Layer)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: noesis-redis-prod
    restart: unless-stopped

    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes

    volumes:
      - redis_data:/data

    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - noesis-network

  # ============================================
  # GROBID (PDF Processing - On Demand)
  # ============================================
  grobid:
    image: lfoppiano/grobid:0.7.0
    container_name: noesis-grobid-prod
    restart: unless-stopped

    # CRITICAL: Run with minimal resources
    # GROBID is memory-hungry but used infrequently
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

    networks:
      - noesis-network

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.prod
    container_name: noesis-backend-prod
    restart: unless-stopped

    env_file:
      - ../services/backend/.env.production

    environment:
      # Docker internal networking
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/noesis_prod
      REDIS_URL: redis://redis:6379
      GROBID_URL: http://grobid:8070
      ENVIRONMENT: production
      LOG_LEVEL: INFO

    volumes:
      # Persistent storage for uploaded PDFs
      - pdf_storage:/app/pdfs
      # Logs for debugging
      - backend_logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 256M

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Expose to Nginx reverse proxy
    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - noesis-network

networks:
  noesis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pdf_storage:
    driver: local
  backend_logs:
    driver: local
