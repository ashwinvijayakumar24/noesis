name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test extras
        run: pip install pytest-cov pytest-asyncio

      - name: Run unit + integration tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/e2e \
            -m "not slow" \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          ENVIRONMENT: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run in-process API contract tests
        run: |
          python -m pytest tests/test_ci_api_contracts.py -v --tb=short
        env:
          ENVIRONMENT: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: services/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ── Eval Integrity Gate ───────────────────────────────────────────────────────
  # Free, offline, deterministic. Does NOT run the eval — that costs money and
  # needs a database, and lives in eval-nightly.yml. See docs/EVAL_GUIDE.md for
  # exactly what this can and cannot check on a PR runner.
  eval-gate:
    name: Eval integrity gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only check diffs against the PR base commit. A shallow
          # clone cannot resolve it and the check would SKIP silently.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pytest
        # The gate itself is stdlib-only; only its tests need pytest.
        run: pip install pytest

      - name: Gate self-tests
        run: python -m pytest scripts/eval/tests/test_ci_gate.py -q

      - name: Eval artefact integrity
        # Blocking. Stdlib only, no credentials, no network.
        run: python scripts/eval/ci_gate.py --base "${{ steps.base.outputs.ref }}"

  # ── Security Scan ─────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        # Non-fatal — surfaces vulnerabilities without blocking deploy
        run: pip-audit -r requirements.txt || true

  # ── Frontend Build + Tests ────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        # Non-fatal — lint errors are surfaced as warnings but don't block deploy
        run: npm run lint || echo "⚠ Lint warnings found (non-blocking)"

      - name: Type check
        # Non-fatal — TS errors are surfaced but don't block backend deploy
        run: npx tsc --noEmit || echo "⚠ TypeScript errors found (non-blocking)"

      - name: Build
        run: npm run build || echo "⚠ Frontend build failed (non-blocking — deploy to Vercel manually)"

  # ── Deploy to EC2 (master only, after CI passes) ──────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend]   # only backend tests gate the EC2 deploy; frontend goes to Vercel separately
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Fail fast — don't silently swallow errors
          script_stop: true
          script: |
            set -e

            APP_PATH="${{ secrets.EC2_APP_PATH }}"

            echo "==> Pulling latest code from master..."
            cd "$APP_PATH"

            # Authenticate git pull with PAT (in-memory only, not stored on disk)
            git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/ashwinvijayakumar24/noesis.git"
            git fetch origin master
            git reset --hard origin/master

            # Remove PAT from remote URL immediately after pull
            git remote set-url origin "https://github.com/ashwinvijayakumar24/noesis.git"

            echo "==> Rebuilding and restarting Docker containers..."
            cd "$APP_PATH/infra"
            docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

            echo "==> Waiting for backend health check..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            echo "==> Pruning unused Docker images to save disk space..."
            docker image prune -f

            echo "✓ Deploy complete"
